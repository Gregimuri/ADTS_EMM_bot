services:
  - type: web
    name: emm-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_PROXY
        value: ""
      - key: SPREADSHEET_ID
        value: "1sRy5VuFGEWsh_RZCGUkWKyKcLP8i6dO-F1smi4ok4Mk"
      - key: SHEET_GID
        value: "0"
