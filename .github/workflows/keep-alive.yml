name: Keep Render Awake

on:
  schedule:
    # каждые 10 минут (у GitHub иногда с задержкой)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          set -e
          url="https://adts-emm-bot.onrender.com/"
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i..."
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 60 "$url" || echo "000")
            echo "HTTP $code"
            cat /tmp/body || true
            echo
            if [ "$code" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 20
          done
          echo "All attempts failed"
          exit 1
