name: Keep Render Awake

on:
  schedule:
    # каждые 10 минут (у GitHub иногда с задержкой)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          set -e
          code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 https://adts-emm-bot.onrender.com/)
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"
